[package]
name = "kumojs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
swc = "82.0.1"
swc_common = { version = "27.0.0", features = ["tty-emitter"] }
swc_core = { version = "84.0.2", features = ["common", "ecma_codegen", "swc_ecma_parser"] }
swc_ecma_ast = "30.0.2"
swc_ecma_parser = "47.0.0"
swc_ecma_visit = "30.0.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
warp = { version = "0.4.3", features = ["server"] }
